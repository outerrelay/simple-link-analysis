# Neo4j holds the knowledge graph. Application state (charts, node positions,
# jobs, staged proposals, review queue) lives in SQLite alongside the app, so
# this is the only service needed for local development.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: sla-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      # Read from .env, so the password is set in exactly one place. Compose
      # substitutes these before starting the container; the ":?" form fails
      # loudly with this message rather than starting a database whose password
      # does not match what the app will use.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env — copy .env.example first}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  neo4j-data:
  neo4j-logs:
