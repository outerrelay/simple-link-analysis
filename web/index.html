<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Link Analysis</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Simple Link Analysis</span>
      </div>

      <div class="chart-picker">
        <select id="chart-select" aria-label="Chart"></select>
        <button id="new-chart" class="ghost" title="New chart">New</button>
      </div>

      <div class="search">
        <input id="search-input" type="search" placeholder="Search entities…"
               autocomplete="off" aria-label="Search entities">
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </header>

    <div class="body">
      <aside class="sidebar" id="sidebar">
        <section class="panel">
          <h2>Layout</h2>
          <div class="layout-scope">
            <label>
              <input type="radio" name="scope" value="all" checked>
              Whole chart
            </label>
            <label>
              <input type="radio" name="scope" value="selection">
              Selection only <span class="count" id="selection-count">(0)</span>
            </label>
          </div>
          <div class="layout-buttons" id="layout-buttons"></div>
        </section>

        <section class="panel">
          <h2>Legend</h2>
          <div id="legend" class="legend"></div>
        </section>
      </aside>

      <main class="canvas-wrap">
        <div id="cy" class="canvas"></div>
        <div class="canvas-hint" id="canvas-hint">
          Search for an entity above to put it on the canvas.
        </div>
        <div class="canvas-tools">
          <button id="fit" class="ghost" title="Fit to view">Fit</button>
          <button id="remove-selected" class="ghost danger"
                  title="Take the selected nodes off this chart. They stay in the database.">
            Remove from chart
          </button>
        </div>
      </main>

      <div class="modal" id="create-modal" hidden>
        <div class="modal-panel" role="dialog" aria-labelledby="create-heading">
          <button class="close" id="create-close" aria-label="Close">×</button>
          <h2 id="create-heading">Add</h2>
          <p class="subtitle" id="create-subtitle"></p>

          <label class="field">
            <span class="field-label" id="create-type-label">Type</span>
            <select id="create-type"></select>
          </label>
          <button id="create-swap" class="ghost swap-direction" hidden>Swap direction</button>

          <div id="create-fields" class="create-fields"></div>

          <div class="modal-actions">
            <button id="create-confirm" class="primary">Add</button>
            <button id="create-cancel" class="ghost">Cancel</button>
          </div>
        </div>
      </div>

      <div class="modal" id="merge-modal" hidden>
        <div class="modal-panel" role="dialog" aria-labelledby="merge-heading">
          <button class="close" id="merge-close" aria-label="Close">×</button>
          <h2 id="merge-heading">Merge records</h2>
          <p class="subtitle" id="merge-subtitle"></p>

          <div class="merge-sides" id="merge-sides"></div>

          <div id="merge-conflicts-block" hidden>
            <div class="merge-mode">
              <label>
                <input type="radio" name="merge-mode" value="survivor" checked>
                Keep the survivor's values
              </label>
              <label>
                <input type="radio" name="merge-mode" value="manual">
                Choose field by field
              </label>
            </div>
            <div id="merge-conflicts" class="merge-conflicts"></div>
          </div>

          <p class="merge-effect" id="merge-effect"></p>
          <p class="merge-note">
            The absorbed record is kept and hidden, not deleted, so this can be undone.
          </p>

          <div class="modal-actions">
            <button id="merge-confirm" class="primary">Merge</button>
            <button id="merge-cancel" class="ghost">Cancel</button>
          </div>
        </div>
      </div>

      <aside class="review" id="review" hidden>
        <button class="close" id="review-close" aria-label="Close">×</button>
        <h2 id="review-title">Review</h2>
        <p class="subtitle" id="review-summary"></p>
        <p class="review-note">
          None of this is in the database yet. Accept what you want to keep.
        </p>
        <label class="review-all">
          <input type="checkbox" id="review-select-all" checked>
          Select all <span class="count" id="review-count"></span>
        </label>
        <div id="review-items" class="review-items"></div>
        <div class="review-actions">
          <button id="review-accept" class="primary">Accept selected</button>
          <button id="review-reject" class="ghost danger">Reject all</button>
        </div>
      </aside>

      <aside class="inspector" id="inspector" hidden>
        <button class="close" id="inspector-close" aria-label="Close">×</button>
        <div id="inspector-body"></div>
      </aside>
    </div>
  </div>

  <!-- Vendored rather than loaded from a CDN: this tool should work offline,
       and an investigation should not announce itself to a third party. -->
  <script src="/vendor/cytoscape.min.js"></script>
  <script src="/vendor/dagre.min.js"></script>
  <script src="/vendor/cytoscape-dagre.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
